name: Store Image in Openshift ConfigMap

on: 
  workflow_dispatch:

env: 
  OPENSHIFT_SERVER: ${{secrets.OPENSHIFT_SERVER}}
  OPENSHIFT_TOKEN: ${{secrets.OPENSHIFT_TOKEN}}
  OPENSHIFT_NAMESPACE: organicgreentea-dev


jobs: 
    validate-image:
      runs-on: ubuntu-latest

      steps: 
        - name: Checkout repository 
          uses:  actions/checkout@v4

        - name: Validate Image
          run: | 
            if [ ! -f .github/workflows/deployment.png]; then
              echo "Error: deployment not found"
              exit 1
            fi

            file .github/workflows/deployment.png

            if ! file .github/workflows/deployment.png | grep -qi "PNG image"; then
                echo "ERROR: File is not a PNG image"
                exit 1 
            fi
             echo "Image validation successful"

    create-configmap:
        runs-on: ubuntu-latest
        needs: validate-image 
        steps: 
          - name: checkout repository 
            uses: actions/checkout/@v4
          - name: Install oc
            uses: redhat-actions/openshift-tools-installer@v1
            with:
              oc: 4
              
          - name: Login to Openshift
            uses: redhat-actions/oc-login@v1
            with: 
              openshift_server_url: ${{ env.OPENSHIFT_SERVER }}
              openshift_token: ${{ env.OPENSHIFT_TOKEN }}
              insecure_skip_tls_verify: true
              namespace: ${{ env.OPENSHIFT_NAMESPACE }}

          
          - name: Create or update ConfigMap
            run: | 
              kubectl create configmap image-config \
                 --from-file= \ 
                 --dry-run=client \
                 -o yaml | kubectl apply -f - 

          - name: verify ConfigMap
            run: | 
              kubectl get configmap image-config




          

            
